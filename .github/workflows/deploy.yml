      - name: Ensure ECR repository exists for Cart service
        run: |
          echo "Checking if ECR repository 'retail-store-cart' exists..."
          if aws ecr describe-repositories --repository-names retail-store-cart --region ${{ secrets.AWS_REGION }} 2>/dev/null; then
