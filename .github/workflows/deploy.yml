  update-helm-charts:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-ui, build-catalog, build-cart, build-checkout, build-orders]
    if: always() && (needs.build-ui.result == 'success' || needs.build-catalog.result == 'success' || needs.build-cart.result == 'success' || needs.build-checkout.result == 'success' || needs.build-orders.result == 'success')
    steps:
      - name: Checkout repository for Helm chart updates
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Update Helm chart values with new image tags
        run: |
          set -e  # Exit on any error
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          
          echo "=========================================="
          echo "Helm Chart Update Process"
          echo "=========================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Short SHA: $SHORT_SHA"
          echo "ECR Registry: $ECR_REGISTRY"
          echo "=========================================="
          echo ""
          
          # Track successful updates
          UPDATED_SERVICES=()
          
          # Function to update values.yaml
          update_values() {
            local service=$1
            local values_file="src/$service/chart/values.yaml"
            
            echo "Processing $service service..."
            
            if [ ! -f "$values_file" ]; then
              echo "✗ ERROR: Helm values file not found: $values_file"
              echo "Expected location: $values_file"
              return 1
            fi
            
            echo "  Found values file: $values_file"
            
            # Backup original file
            cp "$values_file" "$values_file.backup"
            
            # Update only the main image section, preserve infrastructure images
            if awk -v repo="$ECR_REGISTRY/retail-store-$service" -v tag="$SHORT_SHA" '
            BEGIN { in_main_image = 0; updated_repo = 0; updated_tag = 0 }
            /^image:/ { in_main_image = 1 }
            in_main_image && /^  repository:/ && !updated_repo {
              print "  repository: " repo
              updated_repo = 1
              next
            }
            in_main_image && /^  tag:/ && !updated_tag {
              print "  tag: \"" tag "\""
              updated_tag = 1
              next
            }
            /^[a-zA-Z]/ && !/^image:/ { in_main_image = 0 }
            { print }
            ' "$values_file" > "$values_file.tmp"; then
              mv "$values_file.tmp" "$values_file"
              rm "$values_file.backup"
              echo "✓ Successfully updated $values_file"
              echo "  New image: $ECR_REGISTRY/retail-store-$service:$SHORT_SHA"
              UPDATED_SERVICES+=("$service")
            else
              echo "✗ ERROR: Failed to update $values_file with AWK"
              mv "$values_file.backup" "$values_file"
              return 1
            fi
          }
          
          # Update each service if it was built successfully
          echo "Checking build results and updating Helm charts..."
          echo ""
          
          if [ "${{ needs.build-ui.result }}" == "success" ]; then
            echo "[1/5] UI service build succeeded"
            update_values "ui" || echo "⚠ Warning: Failed to update UI Helm chart"
            echo ""
          else
            echo "[1/5] UI service build skipped or failed (status: ${{ needs.build-ui.result }})"
            echo ""
          fi
          
          if [ "${{ needs.build-catalog.result }}" == "success" ]; then
            echo "[2/5] Catalog service build succeeded"
            update_values "catalog" || echo "⚠ Warning: Failed to update Catalog Helm chart"
            echo ""
          else
            echo "[2/5] Catalog service build skipped or failed (status: ${{ needs.build-catalog.result }})"
            echo ""
          fi
          
          if [ "${{ needs.build-cart.result }}" == "success" ]; then
            echo "[3/5] Cart service build succeeded"
            update_values "cart" || echo "⚠ Warning: Failed to update Cart Helm chart"
            echo ""
          else
            echo "[3/5] Cart service build skipped or failed (status: ${{ needs.build-cart.result }})"
            echo ""
          fi
          
          if [ "${{ needs.build-checkout.result }}" == "success" ]; then
            echo "[4/5] Checkout service build succeeded"
            update_values "checkout" || echo "⚠ Warning: Failed to update Checkout Helm chart"
            echo ""
          else
            echo "[4/5] Checkout service build skipped or failed (status: ${{ needs.build-checkout.result }})"
            echo ""
          fi
          
          if [ "${{ needs.build-orders.result }}" == "success" ]; then
            echo "[5/5] Orders service build succeeded"
            update_values "orders" || echo "⚠ Warning: Failed to update Orders Helm chart"
            echo ""
          else
            echo "[5/5] Orders service build skipped or failed (status: ${{ needs.build-orders.result }})"
            echo ""
          fi
          
          echo "=========================================="
          echo "Helm Chart Update Summary"
          echo "=========================================="
          if [ ${#UPDATED_SERVICES[@]} -eq 0 ]; then
            echo "⚠ No Helm charts were updated"
          else
            echo "✓ Successfully updated ${#UPDATED_SERVICES[@]} Helm chart(s):"
            for service in "${UPDATED_SERVICES[@]}"; do
              echo "  - $service"
            done
          fi
          echo "=========================================="
      
      - name: Commit and push Helm chart changes to repository
        run: |
          set -e  # Exit on any error
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          echo "=========================================="
          echo "Git Commit and Push Process"
          echo "=========================================="
          
          # Configure Git user identity
          echo "Configuring Git user identity..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "✓ Git user configured as github-actions[bot]"
          echo ""
          
          # Add all modified values.yaml files to staging area
          echo "Staging modified Helm values files..."
          git add src/*/chart/values.yaml
          
          # Show what files are staged
          echo "Staged files:"
          git diff --staged --name-only | while read file; do
            echo "  - $file"
          done
          echo ""
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "=========================================="
            echo "No changes to commit"
            echo "=========================================="
            echo "All Helm values.yaml files are already up to date"
            echo "This may occur if:"
            echo "  - The images were already at the specified tag"
            echo "  - No services were successfully built"
            exit 0
          fi
          
          # Create commit with descriptive message
          COMMIT_MSG="Update Helm charts with images from commit ${SHORT_SHA}"
          echo "Creating commit..."
          echo "Commit message: $COMMIT_MSG"
          
          if git commit -m "$COMMIT_MSG"; then
            echo "✓ Successfully created commit"
            
            # Show commit details
            echo ""
            echo "Commit details:"
            git log -1 --stat
          else
            echo "✗ ERROR: Failed to create commit"
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "Pushing changes to gitops branch..."
          echo "=========================================="
          
          # Push changes to gitops branch with error handling
          if git push origin HEAD:gitops; then
            echo "✓ Successfully pushed changes to gitops branch"
            echo ""
            echo "Deployment process complete!"
            echo "ArgoCD will detect these changes and sync the applications"
          else
            echo "✗ ERROR: Failed to push changes to gitops branch"
            echo ""
            echo "Attempting to resolve with rebase..."
            
            # Pull with rebase to handle any conflicts
            if git pull --rebase origin gitops; then
              echo "✓ Successfully rebased with remote changes"
              
              # Retry push
              echo "Retrying push..."
              if git push origin HEAD:gitops; then
                echo "✓ Successfully pushed changes after rebase"
                echo ""
                echo "Deployment process complete!"
                echo "ArgoCD will detect these changes and sync the applications"
              else
                echo "✗ ERROR: Failed to push changes after rebase"
                echo ""
                echo "Possible causes:"
                echo "  - Branch protection rules preventing push"
                echo "  - Insufficient permissions for GITHUB_TOKEN"
                echo "  - Network connectivity issues"
                echo ""
                echo "Please check the workflow logs and repository settings"
                exit 1
              fi
            else
