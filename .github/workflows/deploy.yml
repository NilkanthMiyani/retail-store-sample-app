name: Deploy to ECR and Update Helm Charts

on:
  push:
    branches:
      - gitops
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build_ui: ${{ steps.changes.outputs.build_ui }}
      build_catalog: ${{ steps.changes.outputs.build_catalog }}
      build_cart: ${{ steps.changes.outputs.build_cart }}
      build_checkout: ${{ steps.changes.outputs.build_checkout }}
      build_orders: ${{ steps.changes.outputs.build_orders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed services
        id: changes
        run: |
          # Check if workflow was triggered manually
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected - building all services"
            echo "build_ui=true" >> $GITHUB_OUTPUT
            echo "build_catalog=true" >> $GITHUB_OUTPUT
            echo "build_cart=true" >> $GITHUB_OUTPUT
            echo "build_checkout=true" >> $GITHUB_OUTPUT
            echo "build_orders=true" >> $GITHUB_OUTPUT
          else
            echo "Detecting changes from previous commit..."
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
            
            # Check each service directory for changes
            if echo "$CHANGED_FILES" | grep -q "^src/ui/"; then
              echo "build_ui=true" >> $GITHUB_OUTPUT
              echo "✓ UI service has changes"
            else
              echo "build_ui=false" >> $GITHUB_OUTPUT
              echo "✗ UI service has no changes"
            fi
            
            if echo "$CHANGED_FILES" | grep -q "^src/catalog/"; then
              echo "build_catalog=true" >> $GITHUB_OUTPUT
              echo "✓ Catalog service has changes"
            else
              echo "build_catalog=false" >> $GITHUB_OUTPUT
              echo "✗ Catalog service has no changes"
            fi
            
            if echo "$CHANGED_FILES" | grep -q "^src/cart/"; then
              echo "build_cart=true" >> $GITHUB_OUTPUT
              echo "✓ Cart service has changes"
            else
              echo "build_cart=false" >> $GITHUB_OUTPUT
              echo "✗ Cart service has no changes"
            fi
            
            if echo "$CHANGED_FILES" | grep -q "^src/checkout/"; then
              echo "build_checkout=true" >> $GITHUB_OUTPUT
              echo "✓ Checkout service has changes"
            else
              echo "build_checkout=false" >> $GITHUB_OUTPUT
              echo "✗ Checkout service has no changes"
            fi
            
            if echo "$CHANGED_FILES" | grep -q "^src/orders/"; then
              echo "build_orders=true" >> $GITHUB_OUTPUT
              echo "✓ Orders service has changes"
            else
              echo "build_orders=false" >> $GITHUB_OUTPUT
              echo "✗ Orders service has no changes"
            fi
          fi

  build-ui:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.build_ui == 'true'
    steps:
      - name: Checkout source code for UI service
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials for ECR access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Authenticate with Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Ensure ECR repository exists for UI service
        run: |
          echo "Checking if ECR repository 'retail-store-ui' exists..."
          if aws ecr describe-repositories --repository-names retail-store-ui --region ${{ secrets.AWS_REGION }} 2>/dev/null; then
            echo "✓ ECR repository 'retail-store-ui' already exists"
          else
            echo "Creating ECR repository 'retail-store-ui'..."
            if aws ecr create-repository --repository-name retail-store-ui --region ${{ secrets.AWS_REGION }}; then
              echo "✓ Successfully created ECR repository 'retail-store-ui'"
            else
              echo "✗ ERROR: Failed to create ECR repository 'retail-store-ui'"
              exit 1
            fi
          fi
      
      - name: Build and push UI service Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e  # Exit on any error
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="$ECR_REGISTRY/retail-store-ui:$SHORT_SHA"
          
          echo "=========================================="
          echo "Building UI Service Docker Image"
          echo "=========================================="
          echo "Image URI: $IMAGE_URI"
          echo "Build Context: src/ui"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Short SHA: $SHORT_SHA"
          echo "=========================================="
          
          # Build Docker image with progress output
          if docker build --progress=plain -t "$IMAGE_URI" src/ui; then
            echo "✓ Successfully built Docker image for UI service"
          else
            echo "✗ ERROR: Docker build failed for UI service"
            echo "Build context: src/ui"
            echo "Image tag: $IMAGE_URI"
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "Pushing UI Service Image to ECR"
          echo "=========================================="
          
          # Push Docker image to ECR
          if docker push "$IMAGE_URI"; then
            echo "✓ Successfully pushed image to ECR"
            echo "Image URI: $IMAGE_URI"
            echo "Registry: $ECR_REGISTRY"
            echo "Repository: retail-store-ui"
            echo "Tag: $SHORT_SHA"
          else
            echo "✗ ERROR: Failed to push Docker image to ECR"
            echo "Image URI: $IMAGE_URI"
            exit 1
          fi
          
          echo "=========================================="

  build-catalog:
    runs-on: ubuntu-latest
