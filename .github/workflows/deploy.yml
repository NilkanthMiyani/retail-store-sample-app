      - name: Build and push Catalog service Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e  # Exit on any error
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="$ECR_REGISTRY/retail-store-catalog:$SHORT_SHA"
          
          echo "=========================================="
          echo "Building Catalog Service Docker Image"
          echo "=========================================="
          echo "Image URI: $IMAGE_URI"
          echo "Build Context: src/catalog"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Short SHA: $SHORT_SHA"
          echo "=========================================="
          
          # Build Docker image with progress output
          if docker build --progress=plain -t "$IMAGE_URI" src/catalog; then
            echo "✓ Successfully built Docker image for Catalog service"
          else
            echo "✗ ERROR: Docker build failed for Catalog service"
            echo "Build context: src/catalog"
            echo "Image tag: $IMAGE_URI"
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "Pushing Catalog Service Image to ECR"
          echo "=========================================="
          
          # Push Docker image to ECR
          if docker push "$IMAGE_URI"; then
            echo "✓ Successfully pushed image to ECR"
            echo "Image URI: $IMAGE_URI"
            echo "Registry: $ECR_REGISTRY"
            echo "Repository: retail-store-catalog"
            echo "Tag: $SHORT_SHA"
          else
            echo "✗ ERROR: Failed to push Docker image to ECR"
            echo "Image URI: $IMAGE_URI"
            exit 1
          fi
          
          echo "=========================================="

  build-cart:
    runs-on: ubuntu-latest
