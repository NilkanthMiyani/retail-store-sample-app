      - name: Ensure ECR repository exists for Catalog service
        run: |
          echo "Checking if ECR repository 'retail-store-catalog' exists..."
          if aws ecr describe-repositories --repository-names retail-store-catalog --region ${{ secrets.AWS_REGION }} 2>/dev/null; then
            echo "✓ ECR repository 'retail-store-catalog' already exists"
          else
            echo "Creating ECR repository 'retail-store-catalog'..."
